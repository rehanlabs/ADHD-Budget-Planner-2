<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Oceanic Abyssal Slate -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1524"/>
      <stop offset="50%" stop-color="#070f1a"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>

    <!-- Cyan to Emerald Luminous Accent Gradient -->
    <linearGradient id="cyberFrost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Shield Face Frosted Gradient -->
    <linearGradient id="shieldGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162c46" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c1928" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Golden Clarity Spark -->
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="frostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  
  <!-- Outer Tech Border Rim -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2.5"/>

  <!-- Subtle Concentric Ambient Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(45, 212, 191, 0.08)" stroke-width="32"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyberFrost)" stroke-width="4" stroke-linecap="round" stroke-dasharray="80 180" filter="url(#frostGlow)"/>

  <!-- The Burnout Shield (Geometric Protection Crest) -->
  <path d="M 256 100 
           L 380 156 
           C 380 270, 320 366, 256 412 
           C 192 366, 132 270, 132 156 
           Z" 
        fill="url(#shieldGlass)" 
        stroke="url(#cyberFrost)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#frostGlow)"/>

  <!-- Inner Chamfered Shield Plate -->
  <path d="M 256 128 
           L 354 172 
           C 354 260, 306 338, 256 376 
           C 206 338, 158 260, 158 172 
           Z" 
        fill="#0a192a" 
        stroke="rgba(56, 189, 248, 0.3)" 
        stroke-width="2"/>

  <!-- Central Crystalline 8-Point Clarity Spark -->
  <path d="M 256 170 
           L 268 226 
           L 324 238 
           L 268 250 
           L 256 306 
           L 244 250 
           L 188 238 
           L 244 226 
           Z" 
        fill="url(#cyberFrost)" 
        filter="url(#frostGlow)"/>

  <!-- Center Keystone Diamond Core -->
  <polygon points="256,218 276,238 256,258 236,238" fill="url(#sparkGold)"/>

  <!-- Ambient Micro Sparkles -->
  <circle cx="170" cy="140" r="4.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="342" cy="140" r="4.5" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="256" cy="436" r="5" fill="#10b981" filter="url(#frostGlow)"/>
</svg>
