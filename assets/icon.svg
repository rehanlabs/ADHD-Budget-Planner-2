<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1715"/>
      <stop offset="100%" stop-color="#050a09"/>
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldAccent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  
  <!-- Modern Geometric Rim -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#134e4a" stroke-width="3" opacity="0.7"/>

  <!-- Interlocking Focus & Safe-to-Spend Clarity Rings -->
  <!-- Outer Orbit (Runway Protection) -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#134e4a" stroke-width="12" stroke-linecap="round" stroke-dasharray="30 20"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#emeraldGrad2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="140 300" filter="url(#softGlow2)"/>

  <!-- Inner Dynamic Ring (Safe Daily Allowance) -->
  <circle cx="256" cy="256" r="105" fill="#0f2620" stroke="url(#emeraldGrad2)" stroke-width="10"/>

  <!-- Central Keystone Currency Spark -->
  <circle cx="256" cy="256" r="48" fill="url(#goldAccent2)" filter="url(#softGlow2)"/>
  <circle cx="256" cy="256" r="38" fill="#1b382b"/>

  <!-- Minimal Balance Pill -->
  <rect x="238" y="234" width="36" height="44" rx="18" fill="url(#goldAccent2)"/>

  <!-- Ambient Clarity Dots -->
  <circle cx="160" cy="160" r="5" fill="#34d399" opacity="0.8"/>
  <circle cx="352" cy="160" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="256" cy="100" r="4" fill="#34d399" opacity="0.6"/>
</svg>
